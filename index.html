<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un regalo romantico interactivo donde las fotografias vuelan hasta formar un corazon."
    />
    <title>Nuestro Corazón de Recuerdos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body class="min-h-screen overflow-hidden bg-black text-white antialiased">
    <main
      id="experience"
      class="relative min-h-screen w-full overflow-hidden"
      aria-live="polite"
    >
      <div id="star-field" class="pointer-events-none absolute inset-0"></div>
      <div id="petal-field" class="pointer-events-none absolute inset-0"></div>
      <div id="floating-hearts" class="pointer-events-none absolute inset-0"></div>

      <section
        id="intro"
        class="absolute inset-0 z-30 flex flex-col items-center justify-center px-6 text-center"
      >
        <p class="mb-4 text-sm uppercase tracking-[0.38em] text-rose-200/80">
          Para tí
        </p>
        <h1
          class="max-w-4xl font-serif text-4xl font-semibold leading-tight text-white sm:text-6xl lg:text-7xl"
        >
          Cada recuerdo nuestro, vive en mi corazón
        </h1>
        <p class="mt-6 max-w-2xl text-base leading-7 text-white/72 sm:text-lg">
          Una pequeña galaxia de momentos, abrazos y sonrisas preparada solo para
          nosotros.
        </p>
        <button
          id="start-button"
          type="button"
          class="start-button mt-10 rounded-full border border-white/20 bg-white px-8 py-4 text-base font-semibold text-neutral-950 shadow-2xl shadow-rose-500/25 transition hover:scale-105 hover:bg-rose-50 focus:outline-none focus:ring-4 focus:ring-rose-300/60 sm:text-lg"
          aria-label="Comenzar experiencia romantica"
        >
          Haz clic para comenzar ❤️
        </button>
      </section>

      <section
        id="heart-scene"
        class="absolute inset-0 z-10 flex items-center justify-center px-3 py-10 sm:px-8"
        aria-label="Galeria de fotos formando un corazon"
      >
        <div id="heart-field" class="heart-field relative h-full w-full"></div>
      </section>

      <p
        id="final-message"
        class="final-message pointer-events-none absolute left-1/2 top-1/2 z-20 w-[min(88vw,720px)] -translate-x-1/2 -translate-y-1/2 text-center font-serif text-3xl font-semibold leading-tight text-white opacity-0 sm:text-5xl"
      >
        Gracias por cada recuerdo.<br />
        Te amo ❤️
      </p>

      <div class="absolute right-4 top-4 z-40 flex items-center gap-2 sm:right-6 sm:top-6">
        <button
          id="music-toggle"
          type="button"
          class="control-button hidden"
          aria-label="Pausar musica"
          aria-pressed="false"
        >
          ⏸
        </button>
        <button
          id="mute-toggle"
          type="button"
          class="control-button hidden"
          aria-label="Silenciar musica"
          aria-pressed="false"
        >
          🔊
        </button>
      </div>

      <div
        id="lightbox"
        class="lightbox fixed inset-0 z-50 hidden items-center justify-center bg-black/82 p-5 backdrop-blur-md"
        role="dialog"
        aria-modal="true"
        aria-label="Foto ampliada"
      >
        <img id="lightbox-image" src="" alt="" class="lightbox-image" />
      </div>

      <audio id="love-song" src="assets/music/music.mp3" loop preload="auto"></audio>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
